name: sdks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  generate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: npm ci
      - run: npx sdkgen lint
      - run: npx sdkgen generate --no-overlay
      - run: npx sdkgen verify
